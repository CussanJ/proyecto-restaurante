events { worker_connections 1024; }

http {
    server {
        listen 80;

        # 1. Redirigir llamadas de Productos
        location /api/productos {
            proxy_pass http://productos-service:236/productos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Redirigir llamadas de Inventario
        location /api/inventario {
            proxy_pass http://inventario-service:238/inventario;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Redirigir llamadas de Pedidos
        location /api/pedidos {
            proxy_pass http://pedidos-service:237/pedidos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Redirigir llamadas de Autenticación
        location /api/auth {
            proxy_pass http://auth-service:239/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Dozzle Logs (IMPORTANTE: La barra diagonal / al final importa)
        location /logs/ {
            proxy_pass http://dozzle:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Soporte para WebSockets de Dozzle (para ver los logs en tiempo real)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # 6. Todo lo demás va al Frontend (Debe ir AL FINAL de las reglas)
        location / {
            # OJO: Cambia 8103 por el puerto INTERNO de tu frontend si no usa el 8103 por defecto
            proxy_pass http://frontend:8103; 
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}