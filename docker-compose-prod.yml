services:

  mongodb:
    image: mongo:8
    container_name: mongodb-e1b
    restart: unless-stopped
    # Quitamos puertos expuestos, Nginx no los necesita afuera
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  productos-service:
    build:
      context: ./backend/productos-service
    container_name: productos-service-e1b
    restart: unless-stopped
    environment:
      PORT: 236
      MONGODB_URI: mongodb://mongodb:27017/productos_db
      MONGODB_URI_INVENTARIO: mongodb://mongodb:27017/inventario_db
      BASE_URL: http://localhost:8103/api/productos # Ajustado al puerto único
    volumes:
      - ./backend/productos-service:/app
      - /app/node_modules
      - ./backend/productos-service/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy

  inventario-service:
    build:
      context: ./backend/inventario-service
    container_name: inventario-service-e1b
    restart: unless-stopped
    environment:
      PORT: 238
      MONGODB_URI: mongodb://mongodb:27017/inventario_db
    volumes:
      - ./backend/inventario-service:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

  pedidos-service:
    build:
      context: ./backend/pedidos-service
    container_name: pedidos-service-e1b
    restart: unless-stopped
    environment:
      PORT: 237
      MONGODB_URI: mongodb://mongodb:27017/pedidos_db
      PRODUCTOS_URL: http://productos-service:236/productos
      INVENTARIO_URL: http://inventario-service:238/inventario
    volumes:
      - ./backend/pedidos-service:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      productos-service:
        condition: service_started
      inventario-service:
        condition: service_started

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: auth-service-e1b
    restart: unless-stopped
    environment:
      PORT: 239
      MONGODB_URI: mongodb://mongodb:27017/auth_db
      EMAIL_SERVICE: smtp.mailersend.net
      EMAIL_USER: MS_mFX4T0@test-ywj2lpn0qn1g7oqz.mlsender.net
      EMAIL_PASS: mssp.hcJlsmK.yzkq3405mv3gd796.xRfqf3t
      EMAIL_PORT: 587
      FRONTEND_URL: http://localhost:8103
      JWT_SECRET: SUPER_SECRET_HERE
    volumes:
      - ./backend/auth-service:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: frontend-e1b
    restart: unless-stopped
    # Quitamos el puerto de aquí para que no choque con Nginx
    stdin_open: true
    tty: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - productos-service
      - inventario-service
      - pedidos-service
      - auth-service

  # --- EL GATEWAY AHORA ES EL REY DEL PUERTO 8103 ---
  gateway:
    image: nginx:alpine
    container_name: gateway-e1b
    restart: unless-stopped
    ports:
      - "8103:80"   # <--- Mapea el único puerto público al 80 interno de Nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - productos-service
      - inventario-service
      - pedidos-service
      - auth-service
      - dozzle

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle-e1b
    restart: unless-stopped
    # Quitamos puertos públicos
    environment:
      DOZZLE_BASE: /logs 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mongodb_data: